# Lingkungan pengembangan lokal. Tidak menyentuh AWS sama sekali.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: edutrack_owner
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: edutrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack_owner -d edutrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Aplikasi menyambung sebagai app_rw, BUKAN edutrack_owner —
      # ARCHITECTURE.md Pasal 8. Jalankan `npm run db:siapkan-role` sekali
      # supaya kata sandi kedua role ini ada di PostgreSQL.
      DATABASE_URL: postgres://app_rw:lokal-rw@db:5432/edutrack
      DATABASE_URL_RO: postgres://app_ro:lokal-ro@db:5432/edutrack
      PORT: "8080"
      # Di luar Lambda pool boleh lebih dari satu — ARCHITECTURE.md Pasal 13.
      DB_POOL_MAX: "10"
    depends_on:
      db:
        condition: service_healthy
