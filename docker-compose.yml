# Lingkungan pengembangan lokal. Tidak menyentuh AWS sama sekali.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: edutrack_owner
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: edutrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack_owner -d edutrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://edutrack_owner:lokal@db:5432/edutrack
      PORT: "8080"
      # Di luar Lambda pool boleh lebih dari satu — ARCHITECTURE.md Pasal 13.
      DB_POOL_MAX: "10"
    depends_on:
      db:
        condition: service_healthy
