name: Pemeriksaan pull request

# Tidak menyentuh AWS sama sekali. Pull request dari mana pun karenanya
# tidak dapat menyentuh infrastruktur — DEPLOYMENT.md sec 3.2.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bangun image tanpa mendorongnya
        run: docker build -t edutrack-api:uji .
