name: Pemeriksaan pull request

# Tidak menyentuh AWS sama sekali. Pull request dari mana pun karenanya
# tidak dapat menyentuh infrastruktur — DEPLOYMENT.md sec 3.2.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Lapis 2 pada DEPLOYMENT.md sec 6.5 — menolak DROP COLUMN, DROP TABLE,
      # RENAME COLUMN, dan NOT NULL tanpa DEFAULT sebelum sampai ke peninjau.
      - run: npm run lint:migrations
      - run: npm run typecheck
      # Cakupan sekaligus tes: ambang domain/ 100% ditegakkan di sini (AGENTS sec 4.1).
      - run: npm run coverage
      # Bukti penegakan basis data — AGENTS.md sec 4.2. Menyalakan PostgreSQL 17
      # sungguhan lewat Testcontainers, lalu menjalankan pernyataan yang wajib gagal.
      - run: npm run test:db
      - name: Bangun image tanpa mendorongnya
        run: docker build -t edutrack-api:uji .
