name: Uji jabat tangan OIDC

# Dijalankan manual. Membuktikan GitHub Actions dapat memperoleh kredensial
# AWS sementara tanpa satu pun kunci tersimpan.
# Prosedur lengkap: context/RUNBOOK-OIDC.md
on: workflow_dispatch

permissions:
  id-token: write      # tanpa ini GitHub tidak menerbitkan token sama sekali
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      # Dijalankan LEBIH DAHULU supaya hasilnya tetap terlihat meskipun
      # peminjaman role gagal. Yang dicetak hanya klaim — bukan tokennya.
      - name: Tampilkan klaim token OIDC yang dikirim GitHub
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done

          echo "=== Yang HARUS cocok dengan trust policy ==="
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud}'
          echo "=== Keterangan tambahan ==="
          echo "$PAYLOAD" | base64 -d | jq '{repository, ref, workflow_ref}'

      - name: Pinjam role AWS lewat OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: uji-oidc
          aws-region: ap-southeast-1

      - name: Buktikan identitas yang diperoleh
        run: aws sts get-caller-identity
