name: Uji jabat tangan OIDC

# Dijalankan manual. Membuktikan GitHub Actions dapat memperoleh kredensial
# AWS sementara tanpa satu pun kunci tersimpan.
# Prosedur lengkap: context/RUNBOOK-OIDC.md
on: workflow_dispatch

permissions:
  id-token: write      # tanpa ini GitHub tidak menerbitkan token sama sekali
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - name: Pinjam role AWS lewat OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: uji-oidc
          aws-region: ap-southeast-1

      - name: Buktikan identitas yang diperoleh
        run: aws sts get-caller-identity
